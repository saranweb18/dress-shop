<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>MyShop</title>

    <style>
        body {
            background-color: rgb(223, 217, 217);
        }




        /* ===== CAROUSEL ===== */
        .carousel img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        @media (max-width: 768px) {
            .carousel img {
                height: 250px;
            }
        }

        @media (max-width: 400px) {
            .carousel img {
                height: 180px;
            }
        }



        /* ===== PRODUCT CARDS ===== */
        .card {
            border-radius: 10px;
            overflow: hidden;
        }

        .card-img-top {
            width: 100%;
            height: 260px;
            object-fit: contain;
            /* FULL IMAGE FIT */
            background-color: #fff;
            padding: 10px;
            transition: transform 0.3s ease;
        }

        .card:hover .card-img-top {
            transform: scale(1.05);
        }
    </style>
</head>

<body>






    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="./index.html">MyShop</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="./nav.html">Home</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#signinModal">
                            Signin
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#signupModal">
                            Signup
                        </a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="./category.html">Category</a></li>


                </ul>

                <form class="d-flex mx-lg-auto my-2 my-lg-0">
                    <input class="form-control me-2" type="search" placeholder="Search products">
                    <button class="btn btn-light">Search</button>
                </form>

                <a href="./card.html" class="nav-link">
                    <i class="fa fa-shopping-cart fs-4 text-white"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- CAROUSEL -->
    <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./category.jpg" alt="">

            </div>
        </div>


        <!-- CATEGORIES -->
        <div class="container m2-5 my-2">
            <h2 class="text-center mb-4">Shop by Category</h2>
            <div class="row g-3 text-center mb-4">

                <!-- Women -->
                <div class="col-lg-4 col-md-4 col-sm-12">
                    <div class="card h-100 category-card" data-category="women">
                        <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/kurta/q/n/y/3xl-black-buta-shabyaa-original-imahhwf5bxvyhg5g.jpeg?q=70"
                            class="card-img-top" alt="Women">
                        <div class="card-body">
                            <a href="./women.html" class="btn btn-outline-success">Women</a>
                        </div>
                    </div>
                </div>

                <!-- Men -->
                <div class="col-lg-4 col-md-4 col-sm-12">
                    <div class="card h-100 category-card" data-category="men">
                        <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/shirt/e/y/j/m-men-s-satin-shirt-trendy-satin-shirt-men-s-fashionable-satin-original-imahhrgfvhqfggpj.jpeg?q=70"
                            class="card-img-top" alt="Men">
                        <div class="card-body">
                            <a href="men.html" class="btn btn-outline-success">Men</a>
                        </div>
                    </div>
                </div>

                <!-- Kids -->
                <div class="col-lg-4 col-md-4 col-sm-12">
                    <div class="card h-100 category-card" data-category="kids">
                        <img src="https://cdn.fynd.com/v2/falling-surf-7c8bb8/fyprod/wrkr/products/pictures/item/free/resize-w:600/000000410538530008/j4KFhB0bl8p-1.jpg"
                            class="card-img-top" alt="Kids">
                        <div class="card-body">
                            <a href="./kids.html" class="btn btn-outline-success">Kids</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>




        <!-- SIGNIN MODAL -->
        <div class="modal fade" id="signinModal" tabindex="-1">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content bg-secondary text-light">

                    <div class="modal-header py-2">
                        <h6 class="modal-title">Signin</h6>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body p-3">
                        <form class="was-validated">
                            <div class="mb-2">
                                <label class="form-label small">Email</label>
                                <input type="email" class="form-control form-control-sm" required>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small">Password</label>
                                <input type="password" class="form-control form-control-sm" required>
                            </div>

                            <button class="btn btn-dark btn-sm w-100">Login</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>

        <!-- SIGNUP MODAL -->
        <div class="modal fade" id="signupModal" tabindex="-1">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content bg-secondary text-light">

                    <div class="modal-header py-2">
                        <h6 class="modal-title">Signup</h6>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body p-3">
                        <form class="was-validated">

                            <div class="mb-2">
                                <label class="form-label small">First Name</label>
                                <input type="text" class="form-control form-control-sm" required>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small">Last Name</label>
                                <input type="text" class="form-control form-control-sm" required>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small">Email</label>
                                <input type="email" class="form-control form-control-sm" required>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small">Password</label>
                                <input type="password" class="form-control form-control-sm" required>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small">Confirm Password</label>
                                <input type="password" class="form-control form-control-sm" required>
                            </div>

                            <div class="form-check mb-2 small">
                                <input type="checkbox" class="form-check-input" required>
                                <label class="form-check-label">Agree to terms</label>
                            </div>

                            <button class="btn btn-dark btn-sm w-100">Submit</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>



        <footer class="bg-dark text-light pt-5  text-center">
            <div class="container">
                <div class="row">

                    <!-- Brand Info -->
                    <div class="col-lg-12 col-md-12 mb-4">
                        <h5 class="fw-bold">My Shop</h5>
                        <p class="text-light">
                            Your one-stop shop for quality products at the best prices.
                        </p>
                        <input type="text" placeholder="contact gmail">
                        <p>📍 India</p>
                        <p>📞 +91 98765 43210</p>
                        <p>📧 support@shopzone.com</p>
                    </div>
                </div>
            </div>





            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                <strong>Holy guacamole!</strong> You should check in on some of those fields below.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

</body>

</html>
