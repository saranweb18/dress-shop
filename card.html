<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>MyShop</title>

    <style>
        body {
            background-image: url("https://png.pngtree.com/thumb_back/fh260/background/20230722/pngtree-d-rendering-of-shopping-cart-with-add-to-cart-card-on-image_3780296.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Mobile devices (Samsung Galaxy A51 etc.) */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
                background-position: top center;
            }
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        footer {
            margin-top: auto;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        footer {
            margin-top: auto;
        }
    </style>
</head>

<body>


    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="./index.html">MyShop</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="./nav.html">Home</a></li>


                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#signinModal">
                            Signin
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#signupModal">
                            Signup
                        </a>
                    </li>


                    <li class="nav-item"><a class="nav-link" href="./category.html">Category</a></li>
                </ul>

                <form class="d-flex mx-lg-auto my-2 my-lg-0">
                    <input class="form-control me-2" type="search" placeholder="Search products">
                    <button class="btn btn-light">Search</button>
                </form>
                <a href="#" class="nav-link">
                    <i class="fa fa-shopping-cart fs-4 text-white"></i>
                </a>



            </div>
        </div>
    </nav>



    <div class="alert alert-danger alert-dismissible fade show 
            w-100 w-sm-75 w-md-50 w-lg-25 mx-auto text-center" role="alert">
        <strong>🛒 Your cart is empty!</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- SIGNIN MODAL -->
    <div class="modal fade" id="signinModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content bg-secondary text-light">

                <div class="modal-header py-2">
                    <h6 class="modal-title">Signin</h6>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body p-3">
                    <form class="was-validated">
                        <div class="mb-2">
                            <label class="form-label small">Email</label>
                            <input type="email" class="form-control form-control-sm" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small">Password</label>
                            <input type="password" class="form-control form-control-sm" required>
                        </div>

                        <button class="btn btn-dark btn-sm w-100">Login</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- SIGNUP MODAL -->
    <div class="modal fade" id="signupModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content bg-secondary text-light">

                <div class="modal-header py-2">
                    <h6 class="modal-title">Signup</h6>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body p-3">
                    <form class="was-validated">

                        <div class="mb-2">
                            <label class="form-label small">First Name</label>
                            <input type="text" class="form-control form-control-sm" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small">Last Name</label>
                            <input type="text" class="form-control form-control-sm" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small">Email</label>
                            <input type="email" class="form-control form-control-sm" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small">Password</label>
                            <input type="password" class="form-control form-control-sm" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small">Confirm Password</label>
                            <input type="password" class="form-control form-control-sm" required>
                        </div>

                        <div class="form-check mb-2 small">
                            <input type="checkbox" class="form-check-input" required>
                            <label class="form-check-label">Agree to terms</label>
                        </div>

                        <button class="btn btn-dark btn-sm w-100">Submit</button>
                    </form>
                </div>

            </div>
        </div>
    </div>



    <!-- FOOTER -->


    <footer class="bg-dark text-light text-center py-2">
        <div class="container">
            <div class="row">

                <!-- Brand Info -->
                <div class="col-12 mb-1">
                    <h6 class="fw-bold mb-1">My Shop</h6>

                    <p class="small mb-1">
                        Your one-stop shop for quality products at the best prices.
                    </p>

                    <input type="text" placeholder="contact gmail">

                    <p class="small mb-0">
                        📍 India
                    </p>
                    <p class="small mb-0">
                        📞 +91 98765 43210
                    </p>
                    <p class="small mb-0">
                        📧 support@shopzone.com
                    </p>
                </div>

            </div>
        </div>
    </footer>






</body>

</html>
